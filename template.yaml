AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  todo-app

Parameters:
  TableName:
    Type: String
    Default: TodosTable
    Description: Name of the DynamoDB table

Metadata:
  esbuild-config: &esbuild-metadata
    BuildMethod: esbuild
    BuildProperties:
      Minify: false
      Target: "es2020"
      EntryPoints:
        - app.ts
      External:
        - shared

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 3
    Environment:
      Variables:
        TABLE: !Ref TableName
        REGION: !Ref AWS::Region

Resources:
  TodosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: taskId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: taskId
          KeyType: RANGE
      
  CreateTodoFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/create_todo/
      Handler: app.lambda_handler
      Runtime: nodejs24.x
      Events:
        CreateTodo:
          Type: Api
          Properties:
            Path: /todos
            Method: post
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TodosTable
      Layers: 
        - !Ref SharedUtilsLayer
    Metadata:
      <<: *esbuild-metadata

  GetTodoFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/get_todo/
      Handler: app.lambda_handler
      Runtime: nodejs24.x
      Events:
        GetTodo:
          Type: Api
          Properties:
            Path: /todos/{taskId}
            Method: get
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TodosTable
      Layers: 
        - !Ref SharedUtilsLayer
    Metadata:
      <<: *esbuild-metadata

  ListTodoFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/list_todos/
      Handler: app.lambda_handler
      Runtime: nodejs24.x
      Events:
        ListTodo:
          Type: Api
          Properties:
            Path: /todos
            Method: get
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TodosTable
      Layers: 
        - !Ref SharedUtilsLayer
    Metadata:
      <<: *esbuild-metadata

  UpdateTodoFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/update_todo/
      Handler: app.lambda_handler
      Runtime: nodejs24.x
      Events:
        UpdateTodo:
          Type: Api
          Properties:
            Path: /todos/{taskId}
            Method: put
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TodosTable
      Layers: 
        - !Ref SharedUtilsLayer
    Metadata:
      <<: *esbuild-metadata

  DeleteTodoFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/delete_todo/
      Handler: app.lambda_handler
      Runtime: nodejs24.x
      Events:
        DeleteTodo:
          Type: Api
          Properties:
            Path: /todos/{taskId}
            Method: delete
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TodosTable
      Layers: 
        - !Ref SharedUtilsLayer
    Metadata:
      <<: *esbuild-metadata

  SharedUtilsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: layers/shared
      CompatibleRuntimes: 
        - nodejs24.x
      
Outputs:
  TodoApi:
    Description: "API Gateway endpoint URL for the Todo API"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/"
  TodosTableName:
    Description: "Name of the DynamoDB table"
    Value: !Ref TodosTable